<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer clear polycarbonate bevel -->
    <radialGradient id="disc_base" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e8ecf2"/>
      <stop offset="70%" stop-color="#c4ccd8"/>
      <stop offset="95%" stop-color="#b0b8c6"/>
      <stop offset="100%" stop-color="#8c94a4"/>
    </radialGradient>

    <!-- Holographic rainbow diffraction sheen (diagonal cone) -->
    <linearGradient id="iridescence1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#ffde79" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7bf0aa" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#5be5f8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a478ff" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="iridescence2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5be5f8" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#7bf0aa" stop-opacity="0.75"/>
      <stop offset="65%" stop-color="#ffde79" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff7eb3" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Specular light reflections (cross-flare) -->
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer disc body -->
  <circle cx="64" cy="64" r="62" fill="url(#disc_base)"/>

  <!-- Data area with holographic sheen -->
  <circle cx="64" cy="64" r="59" fill="url(#iridescence1)" style="mix-blend-mode: color-dodge;"/>
  <circle cx="64" cy="64" r="59" fill="url(#iridescence2)" style="mix-blend-mode: overlay;"/>

  <!-- Micro-groove radial rings -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.5"/>
  <circle cx="64" cy="64" r="51" fill="none" stroke="#a0a8b8" stroke-width="0.5" stroke-opacity="0.4"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.6"/>
  <circle cx="64" cy="64" r="38" fill="none" stroke="#808898" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.5"/>
  <circle cx="64" cy="64" r="24" fill="none" stroke="#ffffff" stroke-width="1.0" stroke-opacity="0.7"/>

  <!-- Mirror lead-in band -->
  <circle cx="64" cy="64" r="23" fill="#eef2f8"/>
  <circle cx="64" cy="64" r="21" fill="none" stroke="#b0b8c6" stroke-width="0.75"/>

  <!-- Clear plastic inner hub -->
  <circle cx="64" cy="64" r="20" fill="#f8fafc" fill-opacity="0.8"/>
  <!-- Raised ridge ring on hub -->
  <circle cx="64" cy="64" r="15" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="64" cy="64" r="14.5" fill="none" stroke="#cbd5e1" stroke-width="0.75"/>

  <!-- Inner spindle hole rim highlight -->
  <circle cx="64" cy="64" r="8.5" fill="#f1f5f9"/>
  <circle cx="64" cy="64" r="8" fill="none" stroke="#ffffff" stroke-width="0.75"/>

  <!-- Center spindle hole (transparent / cutout) -->
  <circle cx="64" cy="64" r="7.5" fill="#000000" fill-opacity="0"/>
  <mask id="hole_cutout">
    <rect width="128" height="128" fill="white"/>
    <circle cx="64" cy="64" r="7.5" fill="black"/>
  </mask>
</svg>
